name: Checks

# Register H12: nothing was automatic. Every gate already existed and passed
# locally — which is exactly why it needed to stop depending on somebody
# remembering to run it. A policy that is only enforced by habit is not enforced.
#
# This runs the SAME commands a developer runs (`npm run lint`, `npm run
# typecheck`, `npm run test:db`, …). There are no CI-only scripts on purpose: if
# this is green, `npm run lint && npm run typecheck && npm run test:db` is green
# on your machine too, and neither one is a special case.

on:
  push:
    branches: [master, main]
  pull_request:
  # So a gate can be re-run by hand without an empty commit.
  workflow_dispatch:

# A new push to the same branch makes the old run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The gates. One job, because they share the database that `test:db` boots and
  # splitting them would pay for the install three times.
  # ---------------------------------------------------------------------------
  checks:
    name: Lint, typecheck and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install PostgreSQL 16
        # The test runner boots a throwaway cluster with `initdb`/`pg_ctl`; it
        # does not use a service or a container. Ubuntu's repo has 16.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16
          # `initdb` refuses to run as root, so the runner user needs the binaries
          # on PATH and a directory it can write to.
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (both apps)
        run: npm run typecheck

      - name: Lint, i18n parity and the auth-door check
        # `npm run lint` chains all three. The auth-door check matters most in
        # CI: it is the assertion that a RELEASE build has no dev login, and
        # nobody can eyeball that from a diff.
        run: npm run lint

      - name: Session survives a restart
        run: npm run check:session

      - name: Database tests against real PostgreSQL
        # Boots its own cluster, applies every migration in filename order, loads
        # the seed and fixtures, runs every suite, then throws it all away.
        run: npm run test:db

  # ---------------------------------------------------------------------------
  # Expo's own opinion of the project. Separate job so a doctor complaint reads
  # as "your SDK is inconsistent", not "your tests failed".
  # ---------------------------------------------------------------------------
  expo-doctor:
    name: Expo doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the SDK is internally consistent
        working-directory: apps/mobile
        run: npx expo-doctor

      # This step used to run through a filter that deleted the doctor's
      # Metro-config complaint from its output. That complaint was correct.
      # With npm workspaces, `disableHierarchicalLookup: true` is what let
      # reanimated resolve a private semver@7 while the hoisted root copy
      # stayed semver@6, and the WEB bundle died on
      # `semver/functions/satisfies` — a path that only exists in semver 7 —
      # while the Android bundle kept building. The filter therefore silenced
      # the one tool that could have named it, in the only place it was
      # visible.
      #
      # So there is no filter and no exemption now. metro.config.js sets the
      # flag to false with the post-mortem above it, check-metro.mjs guards it
      # in the lint chain, both platform exports build, and the doctor reports
      # 21/21. Any complaint of any kind — including whatever check the doctor
      # gains next — fails this job.

  # ---------------------------------------------------------------------------
  # The artefacts. Typecheck and lint can both pass while a bundle fails — the
  # 2026-11-09 Metro/semver bug proved that: the web export died while the
  # Android bundle kept building. These are the two commands a release actually
  # runs. The public keys are placeholders on purpose: `EXPO_PUBLIC_*` is
  # inlined at bundle time, and a build check must never need a real project or
  # a secret. The admin panel only warns when it is unconfigured, so a
  # placeholder is enough to prove it compiles and prerenders.
  # ---------------------------------------------------------------------------
  build:
    name: Production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-placeholder-key
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-key-placeholder-key

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the admin panel
        run: npm run build --workspace @kunigal/admin

      - name: Export the mobile web bundle
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web-export"

      - name: Export the Android bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/android-export"
